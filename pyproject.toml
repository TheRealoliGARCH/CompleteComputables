[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "complete-computables"
version = "0.1.0"
description = "Seven-state Complete Computables framework for ratio-based financial valuation"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[tool.pytest.ini_options]
testpaths = [
    "test_complete_computables.py",
    "test_financial_economics.py",
    "test_model_interface.py",
]
addopts = "-q"
